[package]
name = "carillon-server"
description = "Carillon watch server"
version = "0.1.0"
authors = ["soywod <clement.douin@posteo.net>"]
rust-version = "1.88"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["email", "command-line-utilities"]
keywords = ["imap", "webhook", "watch", "notification", "idle"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/carillon-server"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]
age = "0.12"
anyhow = "1"
axum = "0.8"
base64 = "0.23"
carillon-core = { version = "0.0.0", default-features = false, features = ["imap", "carddav"] }
hex = "0.4"
hmac = "0.13"
io-http = { version = "0.3", default-features = false }
io-imap = { version = "0.3", default-features = false }
io-oauth = { version = "0.2", default-features = false, features = ["rustls-ring"] }
io-pim-discovery = { version = "0.3", default-features = false, features = ["rustls-ring", "autoconfig", "pacc", "rfc6186", "rfc6764", "rfc8414"] }
io-webdav = { version = "0.1", default-features = false }
pimalaya-stream = { version = "0.1", default-features = false, features = ["std"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-platform-verifier = "0.7"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = "0.26"
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
# ServiceExt::oneshot, for driving the router in CORS/handler tests.
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
carillon-core.git = "https://github.com/pimalaya/carillon-core"
io-imap.git = "https://github.com/pimalaya/io-imap"
io-webdav.git = "https://github.com/pimalaya/io-webdav"
